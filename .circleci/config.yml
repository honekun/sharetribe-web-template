version: 2.1
# Every job runs Node 24 to satisfy package.json `engines.node: 24.x` (Yarn refuses
# to install on any other major) and to match Heroku/Render. Upstream pins 22.x
# here; keep 24 on upstream syncs, and bump the minor when a newer cimg tag ships.

# Fastest safe install: cache yarn downloads with fallbacks, and node_modules only
# when yarn.lock matches exactly (no master/branch fallbacks for node_modules).
commands:
  install_dependencies:
    steps:
      - restore_cache:
          name: Restore Yarn download cache
          keys:
            - yarn-cache-v1-{{ .Branch }}-{{ checksum "yarn.lock" }}
            - yarn-cache-v1-{{ .Branch }}
            - yarn-cache-v1-master
            - yarn-cache-v1-
      - restore_cache:
          name: Restore node_modules
          keys:
            - node-modules-v1-{{ checksum "yarn.lock" }}
      - run:
          name: Install Dependencies
          command: yarn install
      - save_cache:
          name: Save Yarn download cache
          key: yarn-cache-v1-{{ .Branch }}-{{ checksum "yarn.lock" }}
          paths:
            - ~/.cache/yarn
      - save_cache:
          name: Save node_modules
          key: node-modules-v1-{{ checksum "yarn.lock" }}
          paths:
            - node_modules

jobs:
  format:
    docker:
      - image: cimg/node:24.22
    steps:
      - checkout
      - install_dependencies
      - run:
          name: Check code formatting
          command: yarn run format-ci
  test:
    docker:
      - image: cimg/node:24.22
    steps:
      - checkout
      - install_dependencies
      - run:
          name: Run test suite
          command: yarn run test-ci
  build:
    docker:
      - image: cimg/node:24.22
    steps:
      - checkout
      - install_dependencies
      - run:
          name: Build client application
          command: yarn run build
  audit:
    docker:
      - image: cimg/node:24.22
    steps:
      - checkout
      - restore_cache:
          name: Restore Yarn Package Cache
          keys:
            - yarn-packages-{{ .Branch }}-{{ checksum "yarn.lock" }}
            - yarn-packages-{{ .Branch }}
            - yarn-packages-master
            - yarn-packages-
      - run:
          name: Install Dependencies
          command: yarn install
      - save_cache:
          name: Save Yarn Package Cache
          key: yarn-packages-{{ .Branch }}-{{ checksum "yarn.lock" }}
          paths:
            - node_modules/
      - run:
          name: Audit dependencies
          command: yarn run audit
  # AV-owned repository checks. Both scripts use only Node built-ins, so the job
  # skips `yarn install`.
  av-checks:
    docker:
      - image: cimg/node:24.22
    steps:
      - checkout
      - run:
          name: Check AV translation overlays are symmetric
          command: node scripts/check-av-translations.js
      - run:
          name: Check .env-template exposes no secrets to the browser
          command: node scripts/check-env-template.js
workflows:
  format_test_build_audit:
    jobs:
      - format
      - test
      - build
      - av-checks
